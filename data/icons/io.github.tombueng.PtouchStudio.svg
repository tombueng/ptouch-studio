<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a63"/>
      <stop offset="1" stop-color="#212b3b"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edf3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa3ff"/>
      <stop offset="1" stop-color="#2f6fd0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Gehäuse -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#body)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none"
        stroke="#0f1620" stroke-opacity="0.5" stroke-width="6"/>

  <!-- Ausgabeschlitz -->
  <rect x="86" y="150" width="60" height="212" rx="18" fill="#0e141d" fill-opacity="0.75"/>

  <!-- Etikettenband, das aus dem Schlitz läuft; rechts die Schnittzacken -->
  <g filter="url(#drop)">
    <path d="M118 176 h250 l26 24 -26 24 26 24 -26 24 26 24 -26 24 h-250 z"
          fill="url(#tape)"/>
  </g>

  <!-- bedruckbarer Bereich: der Kopf erreicht die Bandränder nicht -->
  <rect x="150" y="196" width="212" height="120" rx="6" fill="#ffffff"/>
  <rect x="150" y="216" width="176" height="30" rx="7" fill="#2b3648"/>
  <rect x="150" y="262" width="116" height="30" rx="7" fill="#5a6a80"/>

  <!-- Funkbogen: die Verbindung ist drahtlos -->
  <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="20">
    <path d="M330 404 a58 58 0 0 1 52 -52" opacity="0.55"/>
    <path d="M330 404 a104 104 0 0 1 98 -98" opacity="0.8"/>
    <path d="M330 404 a150 150 0 0 1 144 -144" opacity="0.35"/>
  </g>
  <circle cx="330" cy="404" r="17" fill="url(#accent)"/>
</svg>
